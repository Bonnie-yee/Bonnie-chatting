<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#f6f2ed"><title>邦尼兔正在调教中</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f2ed;color:#273a2d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.gate{min-height:100dvh;display:grid;place-items:center;padding:28px}.card{width:min(100%,460px);background:#fffdf8;border:1px solid #dce2d7;border-radius:24px;padding:36px;box-shadow:0 18px 60px #273a2d09}.brand{font-size:14px;color:#61715f;margin:0 0 28px}h1{font-size:clamp(27px,6vw,34px);line-height:1.35;letter-spacing:-.04em;margin:0 0 12px}.sponsor{color:#7c8179;font-size:14px;margin:0 0 34px}label{display:block;font-size:14px;margin-bottom:10px}input{width:100%;font:inherit;padding:15px;border:1px solid #cbd5c5;border-radius:12px;background:#fff;color:#243c2c}input:focus{outline:2px solid #75926c;outline-offset:2px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:15px;background:#31513b;color:#fff}#unlock{width:100%;margin-top:14px;font-weight:600}button:disabled{opacity:.6;cursor:wait}.note{font-size:13px;color:#75806e;line-height:1.7;margin:22px 0 0}#message{font-size:14px;color:#974c40;min-height:20px;margin:14px 0 0}.unlocked-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid #dce2d7;gap:16px}.unlocked-bar span{font-size:13px;color:#61715f}.unlocked-bar button{padding:9px 15px;font-size:13px;background:#e6ebdf;color:#31513b}iframe{display:block;width:100%;height:calc(100dvh - 60px);border:0;background:#f6f2ed}[hidden]{display:none!important}@media(max-width:480px){.card{padding:28px 24px}.unlocked-bar{padding:10px 14px}}
</style></head><body>
<main class="gate" id="gate"><section class="card"><p class="brand">邦尼🐰的🐶军师 · 私人参考</p><h1>邦尼兔正在调教中</h1><p class="sponsor">xyz倾情赞助</p><form id="unlock-form"><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" spellcheck="false" required aria-describedby="message"><button id="unlock" type="submit">进入私人版本 ↗</button><p id="message" role="status" aria-live="polite"></p></form><p class="note">无需登录 GPT。输入密码后查看完整参考与上下文。</p></section></main>
<section id="opened" hidden><div class="unlocked-bar"><span id="refresh-status">私人内容已解锁</span><button type="button" id="lock">锁定</button></div><iframe id="private-frame" title="完整私人参考" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads" allow="clipboard-write"></iframe></section>
<script>
(()=>{
 const $=id=>document.getElementById(id),decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let key=null,proof=null,objectUrl=null,currentRevision=-1,busy=false,polling=false;
 async function fetchEnvelope(path){const r=await fetch(path,{cache:'no-store',credentials:'omit',headers:proof?{'x-bonnie-unlock':proof}:{}});if(!r.ok)throw new Error(r.status===401?'password':r.status===429?'rate':'network');const e=await r.json();if(e.schema_version!==1||e.kdf!=='PBKDF2'||e.hash!=='SHA-256'||e.iterations!==600000||decode(e.salt).length!==16||(e.iv&&decode(e.iv).length!==12))throw new Error('format');return e;}
 async function decrypt(e,aad){if(e.aad!==aad)throw new Error('format');const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(e.iv),additionalData:new TextEncoder().encode(aad)},key,decode(e.ciphertext));return new TextDecoder().decode(data);}
 function lock(){key=null;proof=null;currentRevision=-1;$('private-frame').src='about:blank';if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=null;$('opened').hidden=true;$('gate').hidden=false;$('password').value='';$('message').textContent='';}
 async function refresh(){if(!key||polling||document.hidden)return;polling=true;try{const e=await fetchEnvelope('/rules.enc.json');if(!key)return;const rules=JSON.parse(await decrypt(e,'bonnie-private-rules-view-v1'));if(rules.revision>=currentRevision){$('private-frame').contentWindow.dispatchEvent(new CustomEvent('bonnie-cloud-rules',{detail:rules}));currentRevision=rules.revision;$('refresh-status').textContent='云端规则 · 第 '+rules.revision+' 版';}}catch{$('refresh-status').textContent='暂未收到最新规则，稍后自动重试';}finally{polling=false;}}
 $('unlock-form').addEventListener('submit',async event=>{event.preventDefault();if(busy)return;busy=true;$('unlock').disabled=true;$('message').textContent='正在打开…';try{if(!crypto.subtle)throw new Error('unsupported');const meta=await fetchEnvelope('/vault-meta.json');const password=$('password').value;const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const raw=await crypto.subtle.deriveBits({name:'PBKDF2',salt:decode(meta.salt),iterations:meta.iterations,hash:meta.hash},material,256);key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);proof=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',raw))).map(x=>x.toString(16).padStart(2,'0')).join('');const e=await fetchEnvelope('/vault.json');const html=await decrypt(e,'bonnie-private-html-v1');$('password').value='';if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));$('private-frame').onload=()=>refresh();$('private-frame').src=objectUrl;$('gate').hidden=true;$('opened').hidden=false;$('message').textContent='';}catch(error){key=null;proof=null;$('message').textContent=error.message==='network'?'暂时连接不上，请稍后再试。':error.message==='rate'?'尝试次数过多，请五分钟后再试。':error.message==='unsupported'?'请用 Safari、Edge 或其他较新的浏览器打开。':'密码不正确，请再试一次。';}finally{busy=false;$('unlock').disabled=false;}});
 $('lock').addEventListener('click',lock);window.addEventListener('pagehide',lock);window.addEventListener('focus',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});setInterval(refresh,60000);
})();
</script></body></html>
