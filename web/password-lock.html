<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#f6f2ed"><title>Bunny Chatting</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f2ed;color:#273a2d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.gate{min-height:100dvh;display:grid;place-items:center;padding:28px}.card{width:min(100%,460px);background:#fffdf8;border:1px solid #dce2d7;border-radius:24px;padding:36px;box-shadow:0 18px 60px #273a2d09}.brand{font-size:14px;color:#61715f;margin:0 0 28px}h1{font-size:clamp(27px,6vw,34px);line-height:1.35;letter-spacing:-.04em;margin:0 0 12px}.sponsor{color:#7c8179;font-size:14px;margin:0 0 34px}label{display:block;font-size:14px;margin-bottom:10px}input{width:100%;font:inherit;padding:15px;border:1px solid #cbd5c5;border-radius:12px;background:#fff;color:#243c2c}input:focus{outline:2px solid #75926c;outline-offset:2px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:15px;background:#31513b;color:#fff}#unlock{width:100%;margin-top:14px;font-weight:600}button:disabled{opacity:.6;cursor:wait}.note{font-size:13px;color:#75806e;line-height:1.7;margin:22px 0 0}#message{font-size:14px;color:#974c40;min-height:20px;margin:14px 0 0}.unlocked-bar{position:sticky;top:0;z-index:30;background:#f6f2ed;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid #dce2d7;gap:16px}.unlocked-bar span{font-size:13px;color:#61715f}.unlocked-bar button{padding:9px 15px;font-size:13px;background:#e6ebdf;color:#31513b}#private-app{min-height:calc(100dvh - 60px)}[hidden]{display:none!important}@media(max-width:480px){.card{padding:28px 24px}.unlocked-bar{padding:10px 14px}}
</style></head><body>
<main class="gate" id="gate"><section class="card"><p class="brand">Bunny Chatting · 私人参考</p><h1>Bunny Chatting</h1><p class="sponsor">xyz倾情赞助</p><form id="unlock-form"><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" spellcheck="false" required aria-describedby="message"><button id="unlock" type="submit">进入私人版本 ↗</button><p id="message" role="status" aria-live="polite"></p></form><p class="note">无需登录 GPT。输入密码后查看完整参考与上下文。</p></section></main>
<section id="opened" hidden><div class="unlocked-bar"><span id="refresh-status">私人内容已解锁</span><button type="button" id="lock">锁定</button></div><div id="private-app" aria-label="完整私人参考"></div></section>
<script>/*__PASSWORD_CLIENT__*/</script></body></html>
